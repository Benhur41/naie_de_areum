<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Cloudflare Pages는 404.html이 없으면 모든 없는 주소에 index.html을 200으로 응답합니다(SPA 모드).
       이 파일이 있어야 없는 주소가 정상적으로 404를 반환하고, 검색엔진에 중복 페이지가 생기지 않습니다. -->
  <meta name="robots" content="noindex">
  <title>페이지를 찾을 수 없습니다 | 네일드아름</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="stylesheet" href="/css/style.css?v=20261012b">
</head>
<body>
  <main class="section notfound">
    <div class="container narrow">
      <p class="section-index">404 — Not Found</p>
      <h1 class="section-title">
        <span class="en">Page Not Found</span>
        <span class="ko">요청하신 페이지를 찾을 수 없습니다</span>
      </h1>
      <a class="btn btn-dark" href="/">네일드아름 홈으로</a>
    </div>
  </main>
</body>
</html>
